name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx oxlint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: connecto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install server dependencies
        run: cd server && npm ci
      - name: Start server
        run: node server/src/index.js &
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/connecto
          PORT: 4000
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Server never became healthy" >&2
          exit 1
      - run: npm test
        env:
          TEST_BASE_URL: http://localhost:4000
