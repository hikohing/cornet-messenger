name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx oxlint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: connecto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install server dependencies
        run: cd server && npm ci
      # Одноразовые ключи на прогон: без них тесты доставки пушей и VoIP-звонков
      # пропускаются. APNS_HOST уводит отправку на мок, поднимаемый самим тестом.
      - name: Generate push keys
        run: |
          node -e "
            const fs = require('fs')
            const crypto = require('crypto')
            const keys = require('./server/node_modules/web-push').generateVAPIDKeys()
            const { privateKey } = crypto.generateKeyPairSync('ec', { namedCurve: 'prime256v1' })
            fs.writeFileSync('apns-ci.p8', privateKey.export({ type: 'pkcs8', format: 'pem' }))
            fs.appendFileSync(process.env.GITHUB_ENV, 'VAPID_PUBLIC_KEY=' + keys.publicKey + '\n')
            fs.appendFileSync(process.env.GITHUB_ENV, 'VAPID_PRIVATE_KEY=' + keys.privateKey + '\n')
          "
          # Многострочное значение в GITHUB_ENV передаётся только через разделитель.
          {
            echo 'APNS_KEY<<APNS_KEY_EOF'
            cat apns-ci.p8
            echo 'APNS_KEY_EOF'
          } >> "$GITHUB_ENV"
          rm apns-ci.p8
      - name: Start server
        run: node server/src/index.js &
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/connecto
          PORT: 4000
          VAPID_SUBJECT: mailto:ci@example.com
          APNS_KEY_ID: CITESTKEY1
          APNS_TEAM_ID: CITESTTEAM
          APNS_BUNDLE_ID: app.cornet.messenger
          APNS_HOST: http://127.0.0.1:4455
          # Один прогон создаёт больше аккаунтов, чем позволяет боевой лимит.
          RELAX_RATE_LIMITS: '1'
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Server never became healthy" >&2
          exit 1
      - run: npm test
        env:
          TEST_BASE_URL: http://localhost:4000
          # Тест реестра звонков работает с модулем напрямую, а тот тянет за
          # собой подключение к базе.
          DATABASE_URL: postgres://postgres@localhost:5432/connecto
