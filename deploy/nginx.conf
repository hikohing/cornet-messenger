# Шаблон: nginx подставит ${DOMAIN} из переменной окружения при старте.

# HTTP нужен только для проверки Let's Encrypt и перенаправления на HTTPS.
server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Вложение весит до 25 МБ, шифротекст чуть больше исходника — с запасом.
    client_max_body_size 32m;

    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;

        # Без этих двух заголовков не работает WebSocket, то есть не приходят
        # сообщения и не устанавливаются звонки.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По нему сервер понимает, что снаружи HTTPS, и ставит куку Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сокет молчит, пока никто не пишет: без длинного таймаута nginx рвал бы
        # соединение каждую минуту.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
